<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" width="170" height="44">
  <defs>
    <linearGradient id="btnBg_Instagram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="border_Instagram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    @keyframes slideLeft {
      0% {
        opacity: 0;
        transform: translateX(-50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes slideRight {
      0% {
        opacity: 0;
        transform: translateX(50px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .btn-slide {
      animation: slideRight 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
    }
  </style>

  <g class="btn-slide">
    <!-- Button Card -->
    <rect x="1.5" y="1.5" width="167" height="41" rx="8" fill="url(#btnBg_Instagram)" stroke="url(#border_Instagram)" stroke-width="1.6" />

    <!-- Prompt prefix -->
    <text x="12" y="27" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="13px" fill="#f0883e" font-weight="700">❯</text>

