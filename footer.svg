<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 40" width="600" height="40">
  <style>
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-style: italic;
      fill: #8b949e; 
    }
  </style>
  <clipPath id="reveal">
    <rect x="0" y="0" width="0" height="40">
      <animate attributeName="width" values="0;600;600" keyTimes="0;0.5;1" dur="5s" repeatCount="indefinite" />
    </rect>
  </clipPath>
  <text x="300" y="25" text-anchor="middle" class="text" clip-path="url(#reveal)">
    Let&apos;s build something amazing together! 🚀
  </text>
</svg>
