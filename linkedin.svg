<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" width="170" height="44">
  <defs>
    <linearGradient id="btnBg_LinkedIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="50%" stop-color="#0e1217" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="border_LinkedIn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#30363d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-50px) scale(0.95);
      }
      60% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(50px) scale(0.95);
      }
      60% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    .btn-card {
      animation: slideInLeft 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.25s both;
      transform-origin: center center;
    }
  </style>

  <g class="btn-card">
    <!-- Button Card with Rounded Corners & Subtle Border -->
    <rect x="1.5" y="1.5" width="167" height="41" rx="9" fill="url(#btnBg_LinkedIn)" stroke="url(#border_LinkedIn)" stroke-width="1.5" />

    <!-- Terminal Command Chevron -->
    <text x="12" y="27" font-family="'Menlo', 'Fira Code', 'JetBrains Mono', monospace" font-size="13px" fill="#58a6ff" font-weight="700">❯</text>

    <!-- Icon -->
    <g transform="translate(26, 11) scale(0.92)" fill="#58a6ff">
      <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.69 1.69 0 1 0-.01-3.38 1.69 1.69 0 0 0 .01 3.38m1.39 9.74v-8.37H5.07v8.37h2.78z"/>
    </g>

    <!-- Button Text -->
    <text x="54" y="27" font-family="'Menlo', 'Fira Code', -apple-system, monospace" font-size="13px" font-weight="700" fill="#f0f6fc" letter-spacing="0.4px">LinkedIn</text>
  </g>
</svg>