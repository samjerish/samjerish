<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 44" width="170" height="44">
  <defs>
    <linearGradient id="btnBg_Email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="50%" stop-color="#0e1217" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="border_Email" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#30363d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff7b72" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <style>
    @keyframes slideInLeft {
      0% {
        opacity: 0;
        transform: translateX(-50px) scale(0.95);
      }
      60% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes slideInRight {
      0% {
        opacity: 0;
        transform: translateX(50px) scale(0.95);
      }
      60% {
        opacity: 0.9;
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    .btn-card {
      animation: slideInLeft 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      transform-origin: center center;
    }
  </style>

  <g class="btn-card">
    <!-- Button Card with Rounded Corners & Subtle Border -->
    <rect x="1.5" y="1.5" width="167" height="41" rx="9" fill="url(#btnBg_Email)" stroke="url(#border_Email)" stroke-width="1.5" />

    <!-- Terminal Command Chevron -->
    <text x="12" y="27" font-family="'Menlo', 'Fira Code', 'JetBrains Mono', monospace" font-size="13px" fill="#ff7b72" font-weight="700">❯</text>

    <!-- Icon -->
    <g transform="translate(26, 11) scale(0.92)" fill="#ff7b72">
      <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </g>

    <!-- Button Text -->
    <text x="54" y="27" font-family="'Menlo', 'Fira Code', -apple-system, monospace" font-size="13px" font-weight="700" fill="#f0f6fc" letter-spacing="0.4px">Email</text>
  </g>
</svg>