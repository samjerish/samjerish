<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 14.5px;
      letter-spacing: -0.2px;
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes lineFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cursor {
      fill: #58a6ff;
      animation: blink 0.9s infinite;
    }
    .line {
      opacity: 0;
      animation: lineFadeIn 0.3s ease forwards;
    }
    
        .line-0 { animation-delay: 0.20s; }
    .line-1 { animation-delay: 0.55s; }
    .line-2 { animation-delay: 0.71s; }
    .line-3 { animation-delay: 0.87s; }
    .line-4 { animation-delay: 1.03s; }
    .line-5 { animation-delay: 1.11s; }
    .line-6 { animation-delay: 1.46s; }
    .line-7 { animation-delay: 1.62s; }
    .line-8 { animation-delay: 1.78s; }
    .line-9 { animation-delay: 1.94s; }
    .line-10 { animation-delay: 2.10s; }
    .line-11 { animation-delay: 2.26s; }
    .line-12 { animation-delay: 2.42s; }
    .line-13 { animation-delay: 2.50s; }
    .line-14 { animation-delay: 2.85s; }
    .line-15 { animation-delay: 3.01s; }
    .line-16 { animation-delay: 3.17s; }
    .line-17 { animation-delay: 3.25s; }

  </style>

  <!-- Terminal Window Shadow & Base Card -->
  <rect x="2" y="2" width="876" height="536" rx="14" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="876" height="42" rx="14" fill="url(#headerGrad)" />
  <rect x="2" y="32" width="876" height="12" fill="#161b22" />
  <line x1="2" y1="44" x2="878" y2="44" stroke="#30363d" stroke-width="1" />

  <!-- macOS Window Controls (Traffic Lights) -->
  <circle cx="24" cy="22" r="6.5" fill="#ff5f56" />
  <circle cx="44" cy="22" r="6.5" fill="#ffbd2e" />
  <circle cx="64" cy="22" r="6.5" fill="#27c93f" />

  <!-- Terminal Title -->
