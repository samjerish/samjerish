  <style>
    .font-mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 14.5px;
      letter-spacing: -0.2px;
    }
    .line {
      opacity: 1;
    }
    .cursor {
      fill: #58a6ff;
      animation: blink 0.9s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

