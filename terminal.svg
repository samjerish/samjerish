<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 650" width="850" height="650">
  <style>
    .text { font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 15px; fill: #a9b7c6; white-space: pre; }
    .prompt { fill: #98c379; font-weight: bold; }
    .cmd { fill: #e5c07b; }
    .title { fill: #61afef; font-weight: bold; font-size: 18px; }
    .value { fill: #98c379; }
    .key { fill: #e06c75; font-weight: bold; }
    
    /* Typewriter cursor */
    .cursor {
      fill: #a9b7c6;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    /* Line animations */
    .line {
      opacity: 0;
      animation: appear 0.1s forwards;
    }
    @keyframes appear {
      to { opacity: 1; }
    }
    
      .delay-0 { animation-delay: 0.5s; }
      .delay-1 { animation-delay: 1.4s; }
      .delay-2 { animation-delay: 1.7s; }
      .delay-3 { animation-delay: 2.0s; }
      .delay-4 { animation-delay: 2.3s; }
      .delay-5 { animation-delay: 2.6s; }
      .delay-6 { animation-delay: 2.6s; }
      .delay-7 { animation-delay: 3.5s; }
      .delay-8 { animation-delay: 3.8s; }
      .delay-9 { animation-delay: 4.1s; }
      .delay-10 { animation-delay: 4.4s; }
      .delay-11 { animation-delay: 4.7s; }
      .delay-12 { animation-delay: 5.0s; }
      .delay-13 { animation-delay: 5.3s; }
      .delay-14 { animation-delay: 6.2s; }
      .delay-15 { animation-delay: 6.5s; }
      .delay-16 { animation-delay: 6.8s; }
      .delay-17 { animation-delay: 7.1s; }
      .delay-18 { animation-delay: 7.1s; }

  </style>
  
  <!-- Window frame -->
  <rect x="0" y="0" width="850" height="650" rx="10" ry="10" fill="#1e1e1e" />
  <!-- Top bar -->
  <rect x="0" y="0" width="850" height="35" fill="#2d2d2d" rx="10" ry="10" />
  <rect x="0" y="20" width="850" height="15" fill="#2d2d2d" />
  
  <!-- Buttons -->
  <circle cx="20" cy="17" r="6" fill="#ff5f56" />
  <circle cx="40" cy="17" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="17" r="6" fill="#27c93f" />
  
  <!-- Content -->
  <g transform="translate(20, 60)">
