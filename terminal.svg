<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#30363d" />
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 14.5px;
      letter-spacing: -0.2px;
    }
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .anim-1 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
    .anim-2 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.32s both; }
    .anim-3 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.42s both; }
    .anim-4 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both; }
    .anim-5 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.62s both; }
    .anim-6 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.72s both; }
    .anim-7 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.82s both; }
    .anim-8 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 0.92s both; }
    .anim-9 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.02s both; }
    .anim-10 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.12s both; }
    .anim-11 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.22s both; }
    .anim-12 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.32s both; }
    .anim-13 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.42s both; }
    .anim-14 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.52s both; }
    .anim-15 { animation: fadeInUp 0.45s cubic-bezier(0.16, 1, 0.3, 1) 1.62s both; }
    .cursor {
      fill: #58a6ff;
      animation: blink 0.9s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Shadow & Base Card -->
  <rect x="2" y="2" width="876" height="536" rx="14" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="876" height="42" rx="14" fill="url(#headerGrad)" />
  <rect x="2" y="32" width="876" height="12" fill="#161b22" />
  <line x1="2" y1="44" x2="878" y2="44" stroke="#30363d" stroke-width="1" />

  <!-- macOS Window Controls (Traffic Lights) -->
  <circle cx="24" cy="22" r="6.5" fill="#ff5f56" />
  <circle cx="44" cy="22" r="6.5" fill="#ffbd2e" />
  <circle cx="64" cy="22" r="6.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <g transform="translate(440.0, 26)">
    <text text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12px" fill="#8b949e" font-weight="600">
      ⚡ samjerish@macbook: ~ (zsh) — 88x24
    </text>
  </g>

  <!-- Terminal Body Content -->
  <g>
    <g class="anim-1"><text class="font-mono" x="28" y="74"><tspan fill="#3fb950" font-weight="700">samjerish@quantum-core:~$</tspan> <tspan fill="#58a6ff" font-weight="600">whoami --bio</tspan></text></g>
    <g class="anim-2"><text class="font-mono" x="28" y="98"><tspan fill="#d2a8ff" font-size="18px" font-weight="800">⚡ SAM JERISH D</tspan></text></g>
    <g class="anim-3"><text class="font-mono" x="28" y="122"><tspan fill="#79c0ff" font-weight="600">❯ AI &amp; Machine Learning Student  •  Full-Stack Developer</tspan></text></g>
    <g class="anim-4"><text class="font-mono" x="28" y="146"><tspan fill="#8b949e" font-style="italic">  &quot;Creativity and technology to craft user-centric solutions.&quot;</tspan></text></g>
    <g class="anim-5"><text class="font-mono" x="28" y="184"><tspan fill="#3fb950" font-weight="700">samjerish@quantum-core:~$</tspan> <tspan fill="#58a6ff" font-weight="600">neofetch --developer</tspan></text></g>
    <g class="anim-6"><text class="font-mono" x="28" y="208"><tspan fill="#ff7b72" font-weight="700">  [OS]</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#f0883e">macOS Sonoma (Darwin arm64)</tspan></text></g>
    <g class="anim-7"><text class="font-mono" x="28" y="232"><tspan fill="#ff7b72" font-weight="700">  [Host]</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#f0883e">AI, Vision &amp; Robotics Workstation</tspan></text></g>
    <g class="anim-8"><text class="font-mono" x="28" y="256"><tspan fill="#ff7b72" font-weight="700">  [Focus]</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#f0883e">Artificial Intelligence, Deep Learning &amp; Robotics</tspan></text></g>
    <g class="anim-9"><text class="font-mono" x="28" y="280"><tspan fill="#ff7b72" font-weight="700">  [Robotics]</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#f0883e">Intelligent Navigation, Obstacle Avoidance &amp; Perception</tspan></text></g>
    <g class="anim-10"><text class="font-mono" x="28" y="304"><tspan fill="#ff7b72" font-weight="700">  [Stack]</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#f0883e">Python, PyTorch, OpenCV, React, Node.js, C++, TypeScript</tspan></text></g>
    <g class="anim-11"><text class="font-mono" x="28" y="328"><tspan fill="#ff7b72" font-weight="700">  [Status]</tspan><tspan fill="#c9d1d9"> : </tspan><tspan fill="#f0883e">Developing real-world autonomous systems &amp; scalable apps 🚀</tspan></text></g>
    <g class="anim-12"><text class="font-mono" x="28" y="366"><tspan fill="#3fb950" font-weight="700">samjerish@quantum-core:~$</tspan> <tspan fill="#58a6ff" font-weight="600">git status --contributions</tspan></text></g>
    <g class="anim-13"><text class="font-mono" x="28" y="390"><tspan fill="#e3b341">  ⎇ On branch main -&gt; Ahead of &#x27;origin/main&#x27; with continuous commits</tspan></text></g>
    <g class="anim-14"><text class="font-mono" x="28" y="414"><tspan fill="#3fb950" font-weight="600">  ✔ 100% committed to engineering impactful software</tspan></text></g>
    <g class="anim-15"><text class="font-mono" x="28" y="452"><tspan fill="#3fb950" font-weight="700">samjerish@quantum-core:~$</tspan> <tspan class="cursor">█</tspan></text></g>
  </g>
</svg>