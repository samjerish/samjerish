    <text text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', monospace" font-size="12px" fill="#8b949e" font-weight="600">
      ⚡ samjerish@macbook: ~ (zsh) — 88x24
    </text>
  </g>

