    <text class="font-mono line line-14" x="28" y="388"><tspan fill="#e3b341">  ⎇ On branch main -> Ahead of 'origin/main' by commits across AI, Vision & Web</tspan></text>
    <text class="font-mono line line-15" x="28" y="412"><tspan fill="#3fb950" font-weight="600">  ✔ 100% committed to engineering impactful software</tspan></text>
    <text class="font-mono line line-17" x="28" y="450"><tspan fill="#3fb950" font-weight="700">samjerish@quantum-core:~$</tspan> <tspan class="cursor">█</tspan></text>
